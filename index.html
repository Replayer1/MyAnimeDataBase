<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/index.css" />
    <link rel="stylesheet" href="style/content.css" />
    <title>MyAnimeDatabase</title>
  </head>
  <body>
    <header>
      <div class="header__logo">
        <a href="#"
          ><h1>My<span class="header__logo-accent">ANIME</span>Database</h1></a
        >
      </div>
      <div class="header__controls">
        <div class="header__serch">
          <input type="text" id="searchInput" placeholder="Поиск аниме..." />
        </div>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Переключить тему"
          title="Переключить тему"
        >
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle__text">Тёмная</span>
        </button>
      </div>
    </header>

    <nav class="site-nav" aria-label="Навигация по разделам">
      <a href="#" class="site-nav__link site-nav__link--active">Список аниме</a>
      <a href="#" class="site-nav__link">Статистика</a>
      <a href="#" class="site-nav__link">Добавить Аниме</a>
    </nav>

    <main class="page-layout">
      <section class="content-area">
        <section class="content" id="content-container"></section>
        <div id="pagination"></div>
      </section>

      <aside class="filters-sidebar" id="filtersSidebar" aria-label="Фильтры">
        <section class="filters" id="filters">
          <h2 class="filters__title">Фильтры</h2>

          <label class="filters__field">
            <span class="filters__label">Год</span>
            <div class="filters__range">
              <div class="filters__range-values">
                <span id="filterYearFromValue">1900</span>
                <span>—</span>
                <span id="filterYearToValue">2026</span>
              </div>
              <div class="filters__range-slider" id="filterYearSlider">
                <div
                  class="filters__range-progress"
                  id="filterYearProgress"
                ></div>
                <input
                  type="range"
                  class="filters__range-input filters__range-input--from"
                  id="filterYearFrom"
                  min="1900"
                  max="2026"
                  step="1"
                  value="1900"
                  aria-label="Год от"
                />
                <input
                  type="range"
                  class="filters__range-input filters__range-input--to"
                  id="filterYearTo"
                  min="1900"
                  max="2026"
                  step="1"
                  value="2026"
                  aria-label="Год до"
                />
              </div>
            </div>
          </label>

          <label class="filters__field">
            <span class="filters__label">Оценка Shiki (от — до)</span>
            <div class="filters__range">
              <div class="filters__range-values">
                <span id="filterShikiScoreFromValue">0.0</span>
                <span>—</span>
                <span id="filterShikiScoreToValue">10.0</span>
              </div>
              <div class="filters__range-slider" id="filterShikiScoreSlider">
                <div
                  class="filters__range-progress"
                  id="filterShikiScoreProgress"
                ></div>
                <input
                  type="range"
                  class="filters__range-input filters__range-input--from"
                  id="filterShikiScoreFrom"
                  min="0"
                  max="10"
                  step="0.1"
                  value="0"
                  aria-label="Оценка Shiki от"
                />
                <input
                  type="range"
                  class="filters__range-input filters__range-input--to"
                  id="filterShikiScoreTo"
                  min="0"
                  max="10"
                  step="0.1"
                  value="10"
                  aria-label="Оценка Shiki до"
                />
              </div>
            </div>
          </label>

          <label class="filters__field">
            <span class="filters__label">Моя оценка (от — до)</span>
            <div class="filters__range">
              <div class="filters__range-values">
                <span id="filterUserScoreFromValue">0</span>
                <span>—</span>
                <span id="filterUserScoreToValue">10</span>
              </div>
              <div class="filters__range-slider" id="filterUserScoreSlider">
                <div
                  class="filters__range-progress"
                  id="filterUserScoreProgress"
                ></div>
                <input
                  type="range"
                  class="filters__range-input filters__range-input--from"
                  id="filterUserScoreFrom"
                  min="0"
                  max="10"
                  step="1"
                  value="0"
                  aria-label="Моя оценка от"
                />
                <input
                  type="range"
                  class="filters__range-input filters__range-input--to"
                  id="filterUserScoreTo"
                  min="0"
                  max="10"
                  step="1"
                  value="10"
                  aria-label="Моя оценка до"
                />
              </div>
            </div>
          </label>

          <label class="filters__field">
            <span class="filters__label">Статус</span>
            <select id="filterStatus">
              <option value="">Все</option>
            </select>
          </label>

          <label class="filters__field">
            <span class="filters__label">Тип</span>
            <select id="filterType">
              <option value="">Все</option>
            </select>
          </label>

          <div class="filters__field">
            <p class="filters__label">Жанры (можно выбрать несколько)</p>
            <div class="filters__genres" id="filterGenre"></div>
          </div>

          <button type="button" id="filtersResetBtn">Сбросить</button>
        </section>
      </aside>

      <button
        type="button"
        class="filters-toggle"
        id="filtersToggle"
        aria-controls="filtersSidebar"
        aria-expanded="false"
        aria-label="Открыть фильтры"
        title="Фильтры"
      >
        ◀
      </button>
    </main>
    <footer></footer>
  </body>
  <script src="app/theme.js"></script>
  <script src="app/parse.js"></script>
  <script src="app/render.js"></script>
  <script src="app/serch.js"></script>
  <script src="app/pagination.js"></script>
</html>
