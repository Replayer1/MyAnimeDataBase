<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/index.css" />
    <link rel="stylesheet" href="style/content.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="header__logo">
        <a href="#"
          ><h1>My<span class="header__logo-accent">ANIME</span>Database</h1></a
        >
      </div>
      <div class="header__serch">
        <input type="text" id="searchInput" placeholder="Поиск аниме..." />
      </div>
    </header>
    <section class="filters" id="filters">
      <select id="filterYear">
        <option value="">Год (все)</option>
      </select>

      <input
        type="number"
        id="filterShikiScore"
        min="0"
        max="10"
        step="0.1"
        placeholder="Оценка Shiki от"
      />

      <input
        type="number"
        id="filterUserScore"
        min="0"
        max="10"
        step="1"
        placeholder="Моя оценка от"
      />

      <select id="filterStatus">
        <option value="">Статус (все)</option>
      </select>

      <select id="filterType">
        <option value="">Тип (все)</option>
      </select>

      <select id="filterGenre">
        <option value="">Жанр (все)</option>
      </select>

      <button type="button" id="filtersResetBtn">Сбросить</button>
    </section>
    <main>
      <section class="content" id="content-container"></section>
    </main>
    <div id="pagination"></div>
    <footer></footer>
  </body>
  <script src="app/parse.js"></script>
  <script src="app/render.js"></script>
  <script src="app/serch.js"></script>
  <script src="app/pagination.js"></script>
</html>
